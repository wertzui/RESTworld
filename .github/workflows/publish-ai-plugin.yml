name: Publish AI plugin

# Publishes the RESTworld agent plugin to its own small repository, so that
# "copilot plugin marketplace add" and VS Code do not have to clone the whole source tree
# (which contains paths that are too long for a default Windows setup).
on:
  push:
    branches: ["main"]
    paths:
      - "plugins/**"
      - "LICENSE"
      - ".github/workflows/publish-ai-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ai-plugin
  cancel-in-progress: false

env:
  TARGET_REPO: wertzui/RESTworld-AI-plugin

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RESTworld
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out the plugin repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.AI_PLUGIN_REPO_TOKEN }}
          path: target

      - name: Build the content of the plugin repository
        run: |
          set -euo pipefail
          find target -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R source/plugins/restworld/. target/
          cp source/LICENSE target/LICENSE
          cp source/plugins/marketplace/README.md target/README.md
          mkdir -p target/.github/plugin
          cp source/plugins/marketplace/marketplace.json target/.github/plugin/marketplace.json

      - name: Validate the result
        run: |
          set -euo pipefail
          python3 -m json.tool target/plugin.json > /dev/null
          python3 -m json.tool target/.github/plugin/marketplace.json > /dev/null
          test "$(find target/skills -name SKILL.md | wc -l)" -gt 0

      - name: Commit and push
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Sync plugin from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push