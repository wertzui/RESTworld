@if (property()) {
    @if (dropdownProperty(); as dropdownProperty) {
        <rw-signal-input-dropdown [apiName]="apiName()" [property]="dropdownProperty" [field]="simpleField()"></rw-signal-input-dropdown>
    }
    @else {
        @switch (property().type) {
            @case (PropertyType.Object) {
                @if (templatedProperty(); as templatedProperty) {
                    <rw-signal-input-object [apiName]="apiName()" [property]="templatedProperty" [field]="simpleField()"></rw-signal-input-object>
                }
            }
            @case (PropertyType.Collection) {
                @if (templatedProperty(); as templatedProperty) {
                    <rw-signal-input-collection [apiName]="apiName()" [property]="templatedProperty" [field]="simpleField()"></rw-signal-input-collection>
                }
            }
            @default {
                <rw-signal-input-simple [property]="property()" [field]="simpleField()"></rw-signal-input-simple>
            }
        }
    }

    <rw-signal-validation-errors [property]="property()" [field]="simpleField()"></rw-signal-validation-errors>
}
