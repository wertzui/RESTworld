@if (template() !== undefined) {
    <form (submit)="submit(); $event.preventDefault()">
        <div class="blockable-container">
            <div class="blockable-element">
                <rw-signal-validation-errors [field]="$any(form())"></rw-signal-validation-errors>
                <ng-template #defaultContent>
                    <rw-signal-input-template [template]="template()" [apiName]="apiName()" [field]="$any(form())"></rw-signal-input-template>
                </ng-template>
                <ng-container
                    *ngTemplateOutlet="contentRef() ?? defaultContent; context: { form: form, template: template, apiName: apiName() }"></ng-container>
            </div>
            @if (isLoading()) {
                <div class="blockable-overlay">
                    <p-progressSpinner></p-progressSpinner>
                </div>
            }
        </div>

        <div class="grid">
            <div class="col">
                <div class="flex justify-content-end w-full">
                    <ng-template #defaultButtons>
                        @if (beforeButtonsRef(); as beforeButtons) {
                            <ng-container
                                *ngTemplateOutlet="beforeButtons; context: { form: form, template: template, apiName: apiName() }"></ng-container>
                        }
                        <button pButton pRipple type="submit" label="Save" icon="far fa-save" class="mx-2 p-button-success"
                            [disabled]="!allowSubmit()"></button>
                        <button pButton pRipple type="button" label="Reload" icon="fas fa-redo" class="mx-2 p-button-info"
                            (click)="reload()" [disabled]="!canReload()"></button>
                        <button pButton pRipple type="button" label="Delete" icon="far fa-trash-alt"
                            class="ml-2 p-button-danger" (click)="showDeleteConfirmatioModal()"
                            [disabled]="!canDelete()"></button>
                        @if (afterButtonsRef(); as afterButtons) {
                            <ng-container
                                *ngTemplateOutlet="afterButtons; context: { form: form, template: template, apiName: apiName() }"></ng-container>
                        }
                    </ng-template>
                    <ng-container
                        *ngTemplateOutlet="buttonsRef() ?? defaultButtons; context: { form: form, template: template, apiName: apiName() }"></ng-container>
                </div>
            </div>
        </div>
    </form>
}
